name: compare-probe
on:
  push:
    branches: [compare]
    paths: ['probe/compare.py', '.github/workflows/compare.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/compare.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add probe/compare.csv
          git commit -m "compare data" && git push
