name: probe-mimorin
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch sample pages
        run: |
          mkdir -p probe
          for d in 20261124 20261125; do
            curl -sSL -A "Mozilla/5.0 (mahoyo-boxoffice tracker)" "https://mimorin2014.com/blog-date-$d.html" -o "probe/date-$d.html" || true
            sleep 3
          done
          ls -la probe
      - name: push to probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe
          git add probe
          git commit -m "probe pages"
          git push -f origin probe
