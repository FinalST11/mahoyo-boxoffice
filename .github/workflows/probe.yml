name: probe-run-scripts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run
        run: |
          mkdir -p probe
          python scripts/update_sample.py > probe/sample.log 2>&1; echo "exit $?" >> probe/sample.log
          python scripts/update_official.py > probe/official.log 2>&1; echo "exit $?" >> probe/official.log
          git diff --stat > probe/diff.txt
          cp data/*.csv data/*.json probe/ 
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe8
          git add probe && git commit -qm "probe" && git push -qf origin probe8
