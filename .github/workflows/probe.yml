name: probe-feeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (mahoyo-boxoffice tracker)"
          i=0
          for u in \
            "https://news.denfaminicogamer.jp/feed" \
            "https://natalie.mu/comic/feed/news" \
            "https://natalie.mu/eiga/feed/news" \
            "https://www.animatetimes.com/rss/news.xml" \
            "https://www.animatetimes.com/news/rss.php" \
            "https://www.cinematoday.jp/index.xml" \
            "https://www.oricon.co.jp/rss/news_anime.xml" \
            "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf" \
            "https://dengekionline.com/rss/all" \
            "https://www.famitsu.com/rss/famitsu_rss.xml" \
            "https://anime.eiga.com/rss/news.xml" \
            "https://mantan-web.jp/rss/anime.xml" ; do
            i=$((i+1)); curl -sSL -m 30 -A "$UA" -o "probe/feed$i.xml" -w "%{http_code} feed$i $u\n" "$u" || echo "fail $u"
            echo "$u" > "probe/feed$i.url"; sleep 2
          done
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe7
          git add probe && git commit -qm "probe" && git push -qf origin probe7
