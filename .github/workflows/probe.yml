name: probe-lists
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (mahoyo-boxoffice tracker)"
          curl -sSL -A "$UA" -o probe/at_tag.html -w "%{http_code} at\n" "https://www.animatetimes.com/tag/details.php?id=12009"; sleep 3
          curl -sSL -A "$UA" -o probe/df_feed.xml -w "%{http_code} df\n" "https://news.denfaminicogamer.jp/tag/%e9%ad%94%e6%b3%95%e4%bd%bf%e3%81%84%e3%81%ae%e5%a4%9c/feed"
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe6
          git add probe && git commit -qm "probe" && git push -qf origin probe6
