name: probe-official
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (mahoyo-boxoffice tracker)"
          for u in "https://mahoyo-movie.com/" "https://mahoyo-movie.com/news/" "https://prtimes.jp/companyrdf.php?company_id=16356" "https://www.aniplex.co.jp/news/" ; do
            f=$(echo "$u" | sed 's#https://##; s#[/?=&]#_#g')
            curl -sSL -A "$UA" -o "probe/$f.html" -w "%{http_code} $u\n" "$u" || true
            sleep 3
          done
          ls -la probe
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe4
          git add probe && git commit -qm "probe" && git push -qf origin probe4
