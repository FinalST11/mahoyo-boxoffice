name: 每小时抓取票房样本（全天＋中间集计）
on:
  schedule:
    - cron: '17 * * * *'   # 每小时第 17 分钟（GitHub 繁忙时可能延后几分钟到几十分钟）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_sample.py', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 mimorin2014 全天合算
        id: scrape
        run: python scripts/update_sample.py
      - name: 有新数据就提交
        run: |
          if git diff --quiet -- data/; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sample.csv data/status.json data/live.json
          git commit -m "自动更新：${{ steps.scrape.outputs.added }}"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
