// 官方节点：[第几天, 动员, 票房, 出处]（「突破」约数只用来核对，不参与分配）
const EXT = {
  MADOKA: {open: '2026-08-28', anchors: [
    [3, 534722, 939647100, 'https://dengekionline.com/article/202608/86144'],
    [4, 583638, 1018375620, 'https://limo.media/articles/-/136816'],
    [10, 904721, 1537959580, 'https://hashout.jp/anime/11296/'],
    [17, 1093178, 1838113160, 'https://hashout.jp/anime/11296/'],
    [27, 1262137, 2102605880, 'https://animeanime.jp/article/2026/09/24/103197.html'],
    [50, 1515141, 2536114720, 'https://www.animatetimes.com/news/details.php?id=1792220650']]},
  UMA: {open: '2024-05-24', anchors: [
    [3, 226600, 354000000, 'https://www.oricon.co.jp/news/2328677/'],
    [53, 827502, 1338351990, 'https://x.com/moviewalker_bce/status/1813386100590924183']]}
};
const ORDER = [['MAHO', '--c3'], ['MADOKA', '--m1'], ['UMA', '--m2']];
const TABLE_DAYS = [3, 7, 10, 14, 17, 24, 27, 50, 53];
const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (id) => document.getElementById(id);
const state = {metric: 'gross', mode: 'abs', range: 0, lang: 'zh'};
let L = I18N.zh, DATA = null;
function fmt(v, d = 0) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString(L.locale, {minimumFractionDigits: d, maximumFractionDigits: d}); }
const priceFactor = (iso) => { if (!iso) return 1; if (iso.slice(5) === '12-01') return 0.8; if (iso.slice(8) === '01') return 0.88; return new Date(iso + 'T00:00:00Z').getUTCDay() === 3 ? 0.9 : 1; };

// 按官方节点 + 每日样本张数分配（和主页 estimate() 相同；三部都按优惠日折算票房）
function allocate(rows, anchors) {
  const out = rows.map((r) => ({day: r.day, date: r.date, sales: r.sales, a: null, g: null}));
  for (const [key, idx] of [['a', 1], ['g', 2]]) {
    const pts = anchors.filter((x) => x[idx] !== null).sort((p, q) => p[0] - q[0]);
    const w = (r) => r.sales * (key === 'g' ? priceFactor(r.date) : 1);
    let prevDay = 0, prevVal = 0, ratio = null;
    for (const p of pts) {
      const seg = out.filter((r) => r.day > prevDay && r.day <= p[0] && r.sales);
      const tot = seg.reduce((s, r) => s + w(r), 0);
      if (tot > 0) { ratio = (p[idx] - prevVal) / tot; seg.forEach((r) => (r[key] = w(r) * ratio)); }
      prevDay = p[0]; prevVal = p[idx];
    }
    out.filter((r) => r.day > prevDay && r.sales).forEach((r) => (r[key] = ratio === null ? null : w(r) * ratio));
  }
  let ca = 0, cg = 0;
  out.forEach((r) => { if (r.a !== null) ca += r.a; if (r.g !== null) cg += r.g; r.ca = ca; r.cg = cg; });
  return out.filter((r) => r.sales);
}

function lineChart(el, series, opts) {
  el.replaceChildren();
  const W = Math.max(280, el.clientWidth), H = 320, m = {t: 10, r: 24, b: 28, l: 60};
  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H).attr('role', 'img').attr('aria-label', opts.label);
  const x = d3.scaleLinear().domain([1, opts.maxX]).range([m.l, W - m.r]);
  const vals = series.flatMap((s) => s.pts.map((p) => p.y)).concat((opts.dots || []).map((p) => p.y)).filter((v) => v !== null && v > 0);
  const y = d3.scaleLinear().domain([0, (d3.max(vals) || 1) * 1.04]).nice().range([H - m.b, m.t]);
  svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(x.ticks(Math.min(10, Math.floor(W / 64), opts.maxX - 1)).filter(Number.isInteger)).tickFormat((d) => L.day(d))).call((g) => g.selectAll('.domain,line').style('stroke', css('--axis')));
  svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(opts.yfmt)).call((g) => g.select('.domain').remove()).call((g) => g.selectAll('line').style('stroke', css('--grid')));
  if (opts.refY) svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(opts.refY)).attr('y2', y(opts.refY)).attr('stroke', css('--axis')).attr('stroke-dasharray', '3 4');
  const line = d3.line().defined((p) => p.y !== null).x((p) => x(p.x)).y((p) => y(p.y));
  series.forEach((s) => svg.append('path').attr('d', line(s.pts)).attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', s.w).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round'));
  (opts.dots || []).forEach((p) => svg.append('circle').attr('cx', x(p.x)).attr('cy', y(p.y)).attr('r', 4).attr('fill', css('--bg')).attr('stroke', p.color).attr('stroke-width', 2));
  const tip = d3.select(el).append('div').attr('class', 'tip').style('display', 'none');
  const guide = svg.append('line').attr('y1', m.t).attr('y2', H - m.b).attr('stroke', css('--axis')).style('display', 'none');
  const hov = svg.append('g').style('pointer-events', 'none');
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
    .on('pointermove pointerdown', (ev) => {
      const [px] = d3.pointer(ev); const dx = Math.max(1, Math.min(opts.maxX, Math.round(x.invert(px))));
      guide.attr('x1', x(dx)).attr('x2', x(dx)).style('display', null);
      tip.selectAll('*').remove(); hov.selectAll('*').remove();
      tip.append('div').style('font-weight', '600').text(L.dayLong(dx));
      series.forEach((s) => {
        const p = s.pts.find((q) => q.x === dx);
        if (!p || p.y === null) return;
        const row = tip.append('div').style('display', 'flex').style('align-items', 'center').style('gap', '6px');
        row.append('span').style('width', '10px').style('height', '10px').style('border-radius', '2px').style('background', s.color).style('flex', 'none');
        row.append('span').text(s.name + (L === I18N.en ? ': ' : '：') + opts.tipfmt(p.y) + (p.wd ? ' (' + p.wd + ')' : ''));
        hov.append('circle').attr('cx', x(dx)).attr('cy', y(p.y)).attr('r', 4).attr('fill', s.color).attr('stroke', css('--bg')).attr('stroke-width', 2);
      });
      const tw = tip.node().offsetWidth || 190;
      const left = x(dx) + 12 + tw > W ? x(dx) - 12 - tw : x(dx) + 12;
      tip.style('display', null).style('left', left + 'px').style('top', m.t + 'px');
    })
    .on('pointerleave', (ev) => { if (ev.pointerType === 'touch') return; tip.style('display', 'none'); guide.style('display', 'none'); hov.selectAll('*').remove(); });
}

const WD = {zh: '日一二三四五六', ja: '日月火水木金土', en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']};
const wdOf = (iso) => { const i = new Date(iso + 'T00:00:00Z').getUTCDay(); return state.lang === 'en' ? WD.en[i] : (state.lang === 'zh' ? '周' : '') + WD[state.lang][i]; };

function render() {
  document.documentElement.lang = L.htmlLang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = L[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.title = L.title;
  $('lead').innerHTML = L.lead; $('back').textContent = L.back;
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  [['metric', {gross: L.mGross, att: L.mAtt}, 'metric'], ['mode', {abs: L.vAbs, rel: L.vRel}, 'mode']].forEach(([id, txt, k]) => document.querySelectorAll(`#${id} button`).forEach((b) => { b.textContent = txt[b.dataset.v]; b.setAttribute('aria-pressed', String(state[k] === b.dataset.v)); }));
  [...$('range').options].forEach((o) => (o.textContent = L.ranges[o.value]));
  const rel = state.mode === 'rel';
  $('nCum').textContent = L.nCum(rel); $('nDaily').textContent = L.nDaily(rel);
  $('method-list').replaceChildren(...L.methodList.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; }));
  const srcs = $('srcs'); srcs.replaceChildren();
  [['MADOKA'], ['UMA']].forEach(([f]) => { const li = document.createElement('li'); li.append(L.srcHead + L.names[f] + ' — '); EXT[f].anchors.forEach((a, i) => { if (i) li.append(' · '); const ln = document.createElement('a'); ln.href = a[3]; ln.target = '_blank'; ln.rel = 'noopener'; ln.textContent = L.dayN(a[0]); li.append(ln); }); srcs.append(li); });
  $('legend').replaceChildren(...ORDER.map(([f, c]) => { const s = document.createElement('span'); const i = document.createElement('i'); i.className = 'sw'; i.style.background = css(c); s.append(i, L.names[f]); return s; }));
  if (!DATA) return;
  const maho = DATA.MAHO; $('upd').textContent = maho.length ? L.upd(maho[maho.length - 1].day) : '';
  renderCharts(); renderTable();
}

function renderCharts() {
  const g = state.metric === 'gross', rel = state.mode === 'rel';
  const maxAll = Math.max(...ORDER.map(([f]) => (DATA[f].length ? DATA[f][DATA[f].length - 1].day : 0)));
  const maxX = state.range ? state.range : maxAll;
  const unit = g ? 1e8 : 1e4;
  const base = (rows, key) => { const r3 = rows.find((r) => r.day === 3); return r3 ? r3[key] : null; };
  const cum = [], daily = [], dots = [];
  ORDER.forEach(([f, c]) => {
    const rows = DATA[f].filter((r) => r.day <= maxX), color = css(c), w = f === 'MAHO' ? 3 : 2;
    const b = base(DATA[f], g ? 'cg' : 'ca');
    const k = rel ? (b ? 1 / b : null) : 1 / unit, kd = rel ? (b ? 3 / b : null) : 1 / unit;
    if (k === null) return;
    cum.push({name: L.names[f], color, w, pts: rows.map((r) => ({x: r.day, y: (g ? r.cg : r.ca) * k, wd: wdOf(r.date)}))});
    daily.push({name: L.names[f], color, w, pts: rows.map((r) => ({x: r.day, y: (g ? r.g : r.a) === null ? null : (g ? r.g : r.a) * kd, wd: wdOf(r.date)}))});
    (DATA.anchors[f] || []).filter((a) => a[0] <= maxX && (g ? a[2] : a[1]) !== null).forEach((a) => dots.push({x: a[0], y: (g ? a[2] : a[1]) * k, color}));
  });
  const yfmt = rel ? L.yRel : g ? L.yGross : L.yAtt, tipfmt = rel ? L.tipRel : g ? L.tipGross : L.tipAtt;
  lineChart($('cum'), cum, {maxX, yfmt, tipfmt, dots, label: L.hCum, refY: rel ? 1 : null});
  lineChart($('daily'), daily, {maxX, yfmt, tipfmt, label: L.hDaily, refY: rel ? 1 : null});
}

function renderTable() {
  const t = $('ktable'); t.replaceChildren();
  const thead = t.createTHead().insertRow(); const th0 = document.createElement('th'); th0.textContent = L.colDay; thead.append(th0);
  ORDER.forEach(([f]) => { const th = document.createElement('th'); th.textContent = L.names[f]; thead.append(th); });
  const tb = t.createTBody();
  TABLE_DAYS.forEach((d) => {
    const tr = tb.insertRow(); const c0 = tr.insertCell(); c0.textContent = L.dayN(d);
    ORDER.forEach(([f]) => {
      const rows = DATA[f], r = rows.find((x) => x.day === d), r3 = rows.find((x) => x.day === 3), td = tr.insertCell();
      if (!r || !r3) { td.textContent = '—'; return; }
      td.append(L.oku(r.cg / 1e8)); const s = document.createElement('span'); s.className = 'r'; s.textContent = L.times(r.cg / r3.cg); td.append(s);
    });
  });
}

function setLang(lang) { state.lang = I18N[lang] ? lang : 'zh'; L = I18N[state.lang]; try { localStorage.setItem('hf-lang', state.lang); } catch (e) {} render(); }

Promise.all([d3.csv('data/compare_films.csv?v=' + Date.now()), d3.csv('data/sample.csv?v=' + Date.now()), d3.csv('data/milestones.csv?v=' + Date.now())]).then(([cmp, sample, ms]) => {
  const rowsOf = (src, f) => src.filter((r) => r.film === f).map((r) => ({day: num(r.day), date: r.date, sales: num(r.sales)})).sort((a, b) => a.day - b.day);
  const mahoAnch = ms.filter((m) => m.film === 'MAHO' && m.kind === 'point' && num(m.day) !== null).map((m) => [num(m.day), num(m.attendance), num(m.gross)]);
  DATA = {MAHO: allocate(rowsOf(sample, 'MAHO'), mahoAnch), MADOKA: allocate(rowsOf(cmp, 'MADOKA'), EXT.MADOKA.anchors), UMA: allocate(rowsOf(cmp, 'UMA'), EXT.UMA.anchors),
    anchors: {MAHO: mahoAnch, MADOKA: EXT.MADOKA.anchors, UMA: EXT.UMA.anchors}};
  render();
}).catch((e) => { document.querySelectorAll('.chart').forEach((el) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = L.loadErr; el.replaceChildren(p); }); console.error(e); });

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.querySelectorAll('#metric button').forEach((b) => b.addEventListener('click', () => { state.metric = b.dataset.v; render(); }));
document.querySelectorAll('#mode button').forEach((b) => b.addEventListener('click', () => { state.mode = b.dataset.v; render(); }));
$('range').addEventListener('change', (e) => { state.range = Number(e.target.value); render(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => DATA && renderCharts(), 150); });
let initial = 'zh';
try { initial = localStorage.getItem('hf-lang') || ''; } catch (e) { initial = ''; }
if (!I18N[initial]) { const nav = (navigator.language || 'zh').toLowerCase(); initial = nav.startsWith('ja') ? 'ja' : nav.startsWith('zh') ? 'zh' : 'en'; }
const q = new URLSearchParams(location.search).get('lang'); if (I18N[q]) initial = q;
setLang(initial);
</script>
<script>
(() => {
  const c = document.getElementById('snow'); if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x = c.getContext('2d'); let W, H, flakes = [];
  const size = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; };
  size(); addEventListener('resize', size);
  const n = Math.min(70, Math.round(innerWidth / 18));
  for (let i = 0; i < n; i++) flakes.push({x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + .6) * devicePixelRatio, s: Math.random() * .5 + .25, d: Math.random() * Math.PI * 2});
  const tick = () => {
    x.clearRect(0, 0, W, H); x.fillStyle = 'rgba(235,240,255,.55)';
    for (const f of flakes) { f.y += f.s * devicePixelRatio; f.d += .01; f.x += Math.sin(f.d) * .3 * devicePixelRatio; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill(); }
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
