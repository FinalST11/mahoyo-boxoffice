<style>
:root{--bg:#0b1020;--bg2:#121a33;--panel:rgba(20,28,54,.72);--fg:#e9ecf5;--muted:#9aa3bd;--line:rgba(196,205,230,.16);--gold:#d9c08a;--grid:rgba(196,205,230,.08);--axis:rgba(196,205,230,.28);--c0:#7aa7ff;--c1:#e98a6b;--c2:#5fd0a8;--c3:#f1d58f;--aoko:#3d6bff;--alice:#c2334a;--serif:"Cormorant Garamond","Shippori Mincho","Noto Serif SC","Songti SC","Yu Mincho",Georgia,serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei","Yu Gothic",sans-serif;line-height:1.6;
  background:radial-gradient(1200px 600px at 80% -10%,#24305e 0%,rgba(36,48,94,0) 60%),radial-gradient(900px 500px at 0% 0%,#1a2347 0%,rgba(26,35,71,0) 55%),linear-gradient(#0b1020,#0d1328 40%,#0b1020);min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px 56px;display:flex;flex-direction:column;gap:40px}
.hero{position:relative;margin:0 -20px;padding:40px 20px 0;overflow:hidden}
.hero-art{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}

.moon{position:absolute;right:56px;top:96px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 62% 40%,#1a2450 0 47%,transparent 48%),radial-gradient(circle at 50% 50%,#fbf1d2 0 49%,transparent 50%);box-shadow:0 0 60px 18px rgba(241,213,143,.22)}
.top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--serif);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:0;line-height:1.25;letter-spacing:.04em;text-shadow:0 0 24px rgba(122,167,255,.25)}
h2{font-family:var(--serif);font-size:21px;font-weight:500;margin:0 0 6px;letter-spacing:.03em}

tr.live td{color:var(--gold);font-style:italic}

.card.now{border-color:rgba(217,192,138,.55);box-shadow:0 0 0 1px rgba(217,192,138,.15) inset}

.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;backdrop-filter:blur(6px);background:rgba(11,16,32,.4)}
.langs button{font:inherit;font-size:12px;letter-spacing:.06em;background:transparent;color:var(--muted);border:0;padding:6px 14px;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a1606}
.lead{position:relative;font-size:16px;margin:16px 0 0;max-width:720px}
.lead b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.upd{position:relative;font-size:12px;color:var(--muted);margin:8px 0 0;padding-bottom:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,176px),1fr));gap:14px;margin-top:-110px;position:relative}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;backdrop-filter:blur(8px)}
.card::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,rgba(217,192,138,0),rgba(217,192,138,.7),rgba(217,192,138,0))}
.k{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.v{font-family:var(--serif);font-size:clamp(24px,2.6vw,30px);font-weight:600;margin:0;line-height:1.15;font-variant-numeric:lining-nums tabular-nums;color:#fff}
.u{font-size:14px;color:var(--muted);font-family:system-ui,sans-serif;font-weight:400;white-space:nowrap}
.s{font-size:12px;color:var(--muted);margin:6px 0 0}

.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 8px;font-size:13px;color:var(--muted)}
select{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=checkbox]{accent-color:var(--gold)}
.chart{position:relative;min-height:320px;width:100%;background:rgba(14,20,40,.55);border:1px solid var(--line);border-radius:12px;padding:8px 4px 0}
.chart svg text{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:rgba(16,22,44,.96);border:1px solid rgba(217,192,138,.45);box-shadow:0 8px 28px rgba(0,0,0,.45);border-radius:10px;padding:8px 12px;font-size:12px;white-space:nowrap;z-index:2;color:var(--fg)}
.tw{overflow-x:auto;background:rgba(14,20,40,.55);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{color:var(--gold);font-weight:500;font-size:12px;letter-spacing:.04em}
details{background:rgba(14,20,40,.4);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details summary{cursor:pointer;font-family:var(--serif);font-size:17px}
details li{font-size:13px;color:var(--muted);margin:6px 0}
footer{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em}
.visits{margin-top:6px;color:var(--gold);opacity:.85}.visits b{font-weight:600}
footer::before{content:"✦";display:block;color:var(--gold);margin-bottom:8px;font-size:12px}
a{color:#9fc0ff}
.err{color:#ff8a8a;font-size:13px}
@media (max-width:900px){.moon,.hero-art .manor{display:none}}
@media (max-width:600px){h1{font-size:26px}.v{font-size:28px}.upd{padding-bottom:36px}.tiles{margin-top:0}}
.miles{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.miles li{border:1px solid var(--line);border-radius:999px;padding:5px 13px;background:var(--panel);font-size:14px;color:var(--muted);backdrop-filter:blur(6px)}
.miles li b{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--gold);margin-right:6px;font-variant-numeric:lining-nums tabular-nums}
.miles li.latest{border-color:rgba(241,213,143,.6);box-shadow:0 0 14px rgba(241,213,143,.25)}
.miles li.pending{border-style:dashed}
#cel{position:fixed;inset:0;z-index:60;pointer-events:none}
#cel canvas{position:absolute;inset:0;width:100%;height:100%}
#cel .msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;transition:opacity .6s,transform .6s;padding:18px 34px;border-radius:16px;background:rgba(11,16,32,.72);border:1px solid rgba(241,213,143,.5);box-shadow:0 0 40px rgba(241,213,143,.25);backdrop-filter:blur(6px);pointer-events:auto;cursor:pointer}
#cel .msg.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cel .msg p{margin:0}
#cel .msg .big{font-family:var(--serif);font-size:clamp(28px,6vw,46px);font-weight:600;color:var(--gold);letter-spacing:.02em}
#cel .msg .sub{margin-top:4px;color:var(--fg);font-size:15px}
</style>
</head>

const FILMS = [['HF1', '--c0'], ['HF2', '--c1'], ['HF3', '--c2'], ['MAHO', '--c3']];
const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let L = I18N.zh;
function fmt(v, d = 0) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString(L.locale, {minimumFractionDigits: d, maximumFractionDigits: d}); }

// 优惠日的平均票价比平时低：张数多、单价低。只用于魔法使いの夜的票房分配（动员不受影响），HF 维持原样。
// 依据：TOHO 每周三「TOHOウェンズデイ」、每月 1 日「ファーストデイ」1,400 日元，12 月 1 日「映画の日」1,000 日元（一般 2,000～2,200 日元）；
// 其他院线的优惠日各不相同、学生和长者票本来就便宜，所以只按温和的比例折算。
const priceFactor = (iso) => {
  if (!iso) return 1;
  if (iso.slice(5) === '12-01') return 0.8;
  if (iso.slice(8) === '01') return 0.88;
  return new Date(iso + 'T00:00:00Z').getUTCDay() === 3 ? 0.9 : 1;
};

function estimate(sample, milestones) {
  const out = [];
  for (const [f] of FILMS) {
    const rows = sample.filter((r) => r.film === f).map((r) => ({day: num(r.day), date: r.date, sales: num(r.sales), rank: num(r.rank), note: r.note || ''})).sort((a, b) => a.day - b.day);
    if (!rows.length) continue;
    const maxDay = rows[rows.length - 1].day;
    const ms = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.day) !== null && num(m.day) <= maxDay);
    const alloc = (key) => {
      const pts = ms.filter((m) => num(m[key]) !== null).map((m) => [num(m.day), num(m[key])]).sort((a, b) => a[0] - b[0]);
      const w = (r) => r.sales * (key === 'gross' && f === 'MAHO' ? priceFactor(r.date) : 1);
      const est = new Map(); let prevDay = 0, prevVal = 0, ratio = null;
      for (const [d, v] of pts) {
        const seg = rows.filter((r) => r.day > prevDay && r.day <= d && r.sales !== null);
        const tot = seg.reduce((s, r) => s + w(r), 0);
        if (tot > 0) { ratio = (v - prevVal) / tot; seg.forEach((r) => est.set(r.day, w(r) * ratio)); }
        prevDay = d; prevVal = v;
      }
      rows.filter((r) => r.day > prevDay && r.sales !== null).forEach((r) => est.set(r.day, ratio === null ? null : w(r) * ratio));
      return est;
    };
    const ea = alloc('attendance'), eg = alloc('gross');
    let ca = 0, cg = 0;
    for (const r of rows) {
      const a = ea.has(r.day) ? ea.get(r.day) : null, g = eg.has(r.day) ? eg.get(r.day) : null;
      if (a !== null) ca += a; if (g !== null) cg += g;
      out.push({film: f, day: r.day, date: r.date, rank: r.rank, sales: r.sales, imputed: !!r.imputed, est_att: a, est_gross: g, cum_att: ca, cum_gross: cg});
    }
  }
  return out;
}

// 日历换算比：第 3～d 天按日子类型换算成「普通一天」后的票数合计 ÷ 原始合计（首两天不调）
function calRatio(est, f, d) {
  const P = wdPrior(), ws = ['wk', 'wk', 'wk', 'disc', 'fri', 'sat', 'sun'], norm = ws.reduce((t, c) => t + Math.exp(P.w[c]), 0) / 7;
  let raw = 0, adj = 0;
  est.filter((r) => r.film === f && r.sales && r.day <= d).forEach((r) => { raw += r.sales; adj += r.day <= 2 ? r.sales : r.sales * norm / Math.exp(P.w[wdCat(r.date)]); });
  return raw > 0 ? adj / raw : 1;
}
// 最终票房预测
// 基准：魔法使いの夜最新一天的估算累计（每天更新；每次官方公布都会把估算拉回官方数字）。
// 剩余部分：HF 从同一天到最终还涨了多少（剩余倍数），再按两部的近期走势校正：
//   走势校正 = [(近期售票占累计的比例之比) × (按周保留率推算的尾部长度之比)] 的 1/4 次方，第 8 天起生效，限制在 0.85～1.15 倍。
function forecast(est, milestones) {
  const ms = est.filter((r) => r.film === 'MAHO' && r.sales !== null && r.cum_att).sort((a, b) => a.day - b.day);
  if (!ms.length) return [];
  const mm = milestones.filter((m) => m.film === 'MAHO' && m.kind === 'point' && num(m.gross) !== null && num(m.attendance) !== null).sort((a, b) => num(b.day) - num(a.day));
  const sales = (f) => new Map(est.filter((r) => r.film === f && r.sales !== null).map((r) => [r.day, r.sales]));
  const sm = sales('MAHO');
  const rows = [];
  FILMS.slice(0, 3).forEach(([f], i) => {
    const sh = sales(f);
    const maxDay = Math.max(0, ...sh.keys());
    const base = ms.filter((r) => r.day <= maxDay).pop();
    if (!base) return;
    const d = base.day;
    // 只用动员和票房都公布了的最终成绩；只有票房的（如 HF 第三章映连数字，含次年重映）不用，改用最后一个动员、票房都齐的官方节点（下限）
    const fin = milestones.find((m) => m.film === f && m.kind === 'final' && num(m.attendance) !== null && num(m.gross) !== null);
    const pts = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.gross) !== null && num(m.attendance) !== null).sort((a, b) => num(b.day) - num(a.day));
    const end = fin || pts[0];
    const e = est.find((r) => r.film === f && r.day === d);
    if (!end || !e || !e.cum_att || !e.cum_gross) return;
    const endA = num(end.attendance);
    const remH = Math.max(0, endA / e.cum_att - 1);
    // 走势校正（第 8 天起）：窗口最长两周；幅度只取四分之一、限制在 0.85～1.15 倍，避免假日、特别场次造成大起大落
    let adj = null;
    if (d >= 8 && !window.NO_ADJ) {
      const lag = d >= 28 ? 14 : 7, k = d >= 28 ? 14 : Math.min(7, d - 7);
      const recent = [...Array(k)].map((_, j) => d - j), prev = recent.map((x) => x - lag);
      const ok = (m, days) => days.every((x) => m.has(x));
      if (ok(sm, recent) && ok(sm, prev) && ok(sh, recent) && ok(sh, prev)) {
        const sum = (m, days) => days.reduce((t, x) => t + m.get(x), 0);
        const cumS = (m) => [...m].filter(([x]) => x <= d).reduce((t, [, v]) => t + v, 0);
        const weekly = (m) => Math.min(0.95, Math.max(0.05, Math.pow(sum(m, recent) / sum(m, prev), 7 / lag)));

    // 第 3 天起把每天的票数换算成「普通一天」的水平（用 HF 学到的日子类型比例），首两天按首映效应不调；

}

// 预计曲线：从最新一天起，按 HF 各部之后的累计走势，把魔法使いの夜推到各自的预测终点；取三部的平均和最低/最高

function projPath(est, fc) {
  if (!fc.length) return [];
  const rows = wdRows(est.filter((r) => r.film === 'MAHO')), base = fc[0].day;
  const baseDate = (est.find((r) => r.film === 'MAHO' && r.day === base) || {}).date;
  if (!baseDate) return [];
  const cal = wdCalib(rows), hfMax = fc.map((row) => Math.max(...est.filter((r) => r.film === FILMS[row.idx][0] && r.cum_gross).map((r) => r.day)));
  const last = Math.min(...hfMax), cum = new Map([[base, 0]]);

  for (let t = base + 1; t <= Math.max(...hfMax); t++) {
    const date = addDays(baseDate, t - base), v = wdPredict(t, date, rows, cal);
    c += (v || 0) * priceFactor(date); cum.set(t, c);

  const per = fc.map((row, i) => {
    const hf = new Map(est.filter((r) => r.film === FILMS[row.idx][0] && r.cum_gross).map((r) => [r.day, r.cum_gross]));
    const span = row.endG - row.hfBase, H = hfMax[i];

  const e = bandErr(base), gs = fc.map((r) => r.gross), minG = Math.min(...gs), maxG = Math.max(...gs), b0 = fc[0].baseG;

// 回测误差：把 HF 三部轮流当作「魔法使いの夜」、只给它前 k 天的数据，用另外两部预测它的最终动员；
// 取 k-1～k+1 天、三部的平均绝对误差（最少 2%）。上映越久误差越小，色带自然收窄
const BANDERR = new Map();
function bandErr(k) {
  const key = k + '|' + SAMPLE.length + '|' + MS.length;
  if (BANDERR.has(key)) return BANDERR.get(key);

  for (const [tgt] of FILMS.slice(0, 3)) {

    if (!fin) continue;
    for (const kk of [k - 1, k, k + 1]) {
      if (kk < 2 || !EST.some((r) => r.film === tgt && r.day === kk && r.cum_att)) continue;
      const E = EST.filter((r) => r.film !== tgt && r.film !== 'MAHO').concat(EST.filter((r) => r.film === tgt && r.day <= kk).map((r) => ({...r, film: 'MAHO'})));
      const F = forecast(E, MS.filter((m) => m.film !== tgt && m.film !== 'MAHO'));
      if (F.length) errs.push(Math.abs(F.reduce((t, r) => t + r.att, 0) / F.length / num(fin.attendance) - 1));

let SAMPLE = null, MS = null, EST = [], FC = [], STATUS = null, INTERIM = [], RUN = null;

// 把 ISO 时间显示成日本时间的「YYYY-MM-DD HH:MM」
const fmtJst = (iso) => { const t = new Date(iso); if (isNaN(t)) return ''; const j = new Date(t.getTime() + 9 * 3600e3); return j.toISOString().slice(0, 16).replace('T', ' '); };

// ── 当前估算（nowcast）────────────────────────────────
// 用这部电影自己的历史算出「14 时 / 19 时售出全天的比例」（平日、周末假日分开），
// 再按当前日本时间在 开场前→14 时→19 时→末场 之间线性插值，推算今天到现在为止的样本售票。
const REST_DAYS = new Set(['2017-11-03', '2017-11-23', '2017-12-23', '2019-01-14', '2019-02-11', '2020-09-21', '2020-09-22', '2026-11-23', '2026-12-29', '2026-12-30', '2026-12-31', '2027-01-01', '2027-01-02', '2027-01-03', '2027-01-11', '2027-02-11', '2027-02-23']);
const isRest = (iso) => { const w = new Date(iso + 'T00:00:00Z').getUTCDay(); return w === 0 || w === 6 || REST_DAYS.has(iso); };
// 四类：平日（第二天上班）、周五型（今天上班、明天休息）、周六型（今天、明天都休息）、周日型（今天休息、明天上班）
const dayType = (iso) => { const nx = isRest(addDays(iso, 1)); return isRest(iso) ? (nx ? 'sat' : 'sun') : (nx ? 'fri' : 'wk'); };
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const jstNow = () => { const j = new Date(Date.now() + 9 * 3600e3); return {date: j.toISOString().slice(0, 10), min: j.getUTCHours() * 60 + j.getUTCMinutes(), hhmm: j.toISOString().slice(11, 16)}; };
const median = (x) => { const v = x.slice().sort((a, b) => a - b); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };

// 14 时 / 19 时集计占全天的比例，用本片已有的全部数据校准（每晚全天数字进来后自动更新）。
// 每类日子（平日 / 周五型 / 周六型 / 周日型）的比例 = 本类自己的中位数 和 所有日子的整体中位数 的加权平均：
//   比例 = (本类天数 × 本类中位数 + 2 × 整体中位数) ÷ (本类天数 + 2)
// 本类数据少时主要靠整体，多了就越来越看本类。首日有首映效应，不计入。
// 例外：平日 19 时从保守的 84% 起步（代替整体中位数），只用 11/25 起的实际平日数据逐步调整。
const OPENING = '2026-11-20';
function cutShares() {
  const full = new Map(SAMPLE.filter((r) => r.film === 'MAHO' && num(r.sales)).map((r) => [r.date, num(r.sales)]));
  const init = {14: 0.47, 19: 0.83};
  const sh = {wk: {}, fri: {}, sat: {}, sun: {}};
  for (const c of ['14', '19']) {
    const all = INTERIM.filter((r) => r.cut === c && num(r.sales) && full.has(r.date) && r.date !== OPENING).map((r) => ({t: dayType(r.date), d: r.date, v: num(r.sales) / full.get(r.date)}));
    const pooled = all.length ? median(all.map((x) => x.v)) : init[c];
    for (const t of Object.keys(sh)) {
      // 平日的 19 时比例偏保守：从 84% 起步（比例越高，推算的全天越少），只用 11/25 起的实际平日数据逐步调整
      const wk19 = t === 'wk' && c === '19';
      const own = all.filter((x) => x.t === t && (!wk19 || x.d >= '2026-11-25')).map((x) => x.v);
      const prior = wk19 ? 0.84 : pooled;
      sh[t][c] = own.length ? (own.length * median(own) + 2 * prior) / (own.length + 2) : prior;

function shareAt(type, min, sh) {

function celebrate(big, sub) {

  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 4.5; ps.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.008 + Math.random() * 0.01, c: Math.random() < 0.3 ? '#fff6dc' : c, r: 1 + Math.random() * 1.8}); } };
  const times = [0, 350, 700, 1150, 1600, 2100, 2700];
  times.forEach((t) => setTimeout(() => burst(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.35)), t));

  if (!SAMPLE) return;
  const maxDay = Math.max(57, ...SAMPLE.map((r) => num(r.day) || 0));
  const series = (key) => FILMS.map(([f, c], i) => ({film: f, name: L.films[i], color: css(c), w: f === 'MAHO' ? 3 : 2, pts: key(f)}));
  const CR = rangeOf(state.crange, maxDay);
  const projAll = projPath(EST, FC), proj = projAll.filter((p) => p.x <= CR);
  const cumSeries = series((f) => EST.filter((r) => r.film === f && r.day <= CR).map((r) => ({x: r.day, y: r.cum_gross ? r.cum_gross / 1e8 : null})));
  if (proj.length > 1) cumSeries.push({film: 'PROJ', name: L.projName, color: css('--c3'), w: 2, dash: true, pts: proj.map((p) => ({x: p.x, y: p.mean / 1e8}))});  // 从实际线的最后一天起画，两条线首尾相接
  lineChart($('cum'), cumSeries, {
    maxX: CR, label: L.labelCum, yfmt: L.axisGross, tipfmt: L.tipGross,
    endLabel: proj.length > 1 && FC.length && proj.length === projAll.length ? {x: proj[proj.length - 1].x, y: proj[proj.length - 1].mean / 1e8, color: css('--c3'), text: L.projEnd(L.gross(FC.reduce((t, f) => t + f.gross, 0) / FC.length / 1e8, 1) + (state.lang === 'en' ? ' ' : '') + L.grossUnit)} : null,
    band: proj.length > 1 ? {color: css('--c3'), pts: proj.map((p) => ({x: p.x, lo: p.lo / 1e8, hi: p.hi / 1e8}))} : null,
    note: (f, d) => {
      const m = MS.find((r) => r.film === f && r.kind === 'point' && num(r.day) === d);
      if (!m) return null;
      const t = new String(L.offNote(num(m.attendance), num(m.gross)) + (m.source_url ? '\n' + L.src(hostOf(m.source_url)) : ''));
      t.dot = num(m.gross) !== null ? num(m.gross) / 1e8 : null;
      return t;
    },
    dots: MS.filter((m) => m.kind === 'point' && num(m.gross) !== null && num(m.day) !== null && num(m.day) <= CR).map((m) => ({x: num(m.day), y: num(m.gross) / 1e8, color: css(FILMS.find((f) => f[0] === m.film)[1])}))});
  const R = rangeOf(state.range, maxDay);
  lineChart($('daily'), series((f) => SAMPLE.filter((r) => r.film === f && num(r.day) <= R).map((r) => ({x: num(r.day), y: num(r.sales)})).sort((a, b) => a.x - b.x)), {
    maxX: R, log: state.log, label: L.labelDaily, yfmt: L.axisSales, tipfmt: L.tipSales});
}

function setLang(lang) {
  state.lang = I18N[lang] ? lang : 'zh'; L = I18N[state.lang];
  try { localStorage.setItem('hf-lang', state.lang); } catch (e) {}
  renderText(); renderCharts(); renderSources(); renderCalib(); renderRetro(); renderVisits();
}

// 访问统计：abacus 免费计数器（无需注册）。同一浏览器只算一次访问人数，每次打开都算一次浏览。本地预览不计数。
const visits = {u: null, v: null};
function renderVisits() { const el = $('visits'); if (visits.u === null || visits.v === null) { el.hidden = true; return; } el.innerHTML = L.visits(fmt(visits.u), fmt(visits.v)); el.hidden = false; }
(async () => {
  if (!/github\.io$/.test(location.hostname)) return;
  const api = 'https://abacus.jasoncameron.dev', ns = 'finalst11-mahoyo-boxoffice';
  let seen = false; try { seen = localStorage.getItem('hf-visited') === '1'; } catch (e) {}
  const call = async (op, key) => { try { const r = await fetch(`${api}/${op}/${ns}/${key}`); if (!r.ok) return null; const j = await r.json(); return typeof j.value === 'number' ? j.value : null; } catch (e) { return null; } };
  const [u, v] = await Promise.all([call(seen ? 'get' : 'hit', 'visitors'), call('hit', 'views')]);
  if (!seen && u !== null) { try { localStorage.setItem('hf-visited', '1'); } catch (e) {} }
  visits.u = u; visits.v = v; renderVisits();
})();

let initial = 'zh';
try { initial = localStorage.getItem('hf-lang') || ''; } catch (e) { initial = ''; }
if (!I18N[initial]) { const nav = (navigator.language || 'zh').toLowerCase(); initial = nav.startsWith('ja') ? 'ja' : nav.startsWith('zh') ? 'zh' : 'en'; }
const q = new URLSearchParams(location.search).get('lang'); if (I18N[q]) initial = q;
setLang(initial);

// 读取全部数据；页面开着时每 5 分钟重新读一次，爬虫推送的新数字（14/19 时集计、全天数字）会自动反映出来
const loadAll = () => Promise.all([d3.csv('data/sample.csv?v=' + Date.now()), d3.csv('data/milestones.csv?v=' + Date.now()), d3.json('data/status.json?v=' + Date.now()).catch(() => null), d3.csv('data/interim.csv?v=' + Date.now()).catch(() => [])]).then(([sample, ms, st, im]) => {
  SAMPLE = sample; MS = ms; STATUS = st; INTERIM = im || []; REPLAY.clear(); EST = estimate(sample, ms); FC = forecast(EST, ms);
  renderText(); renderCharts(); renderSources(); renderCalib(); renderRetro();
}).catch((e) => { document.querySelectorAll('.chart').forEach((el) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = L.loadErr; el.replaceChildren(p); }); console.error(e); });
loadAll();
loadRun();

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('crange').addEventListener('change', (e) => { state.crange = Number(e.target.value); renderCharts(); });
$('range').addEventListener('change', (e) => { state.range = Number(e.target.value); renderCharts(); });
$('log').addEventListener('change', (e) => { state.log = e.target.checked; renderCharts(); });
$('mprev').addEventListener('click', () => { state.mpage--; renderText(); });
$('rprev').addEventListener('click', () => { state.rpage--; renderRetro(); });
$('rnext').addEventListener('click', () => { state.rpage++; renderRetro(); });
$('mnext').addEventListener('click', () => { state.mpage++; renderText(); });
setInterval(() => { if (SAMPLE) loadAll(); loadRun(); }, 5 * 60e3);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderCharts, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
</script>
<script>
(() => {
  const c = document.getElementById('snow'); if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x = c.getContext('2d'); let W, H, flakes = [];
  const size = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; };
  size(); addEventListener('resize', size);
  const n = Math.min(70, Math.round(innerWidth / 18));
  for (let i = 0; i < n; i++) flakes.push({x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + .6) * devicePixelRatio, s: Math.random() * .5 + .25, d: Math.random() * Math.PI * 2});
  const tick = () => {
    x.clearRect(0, 0, W, H); x.fillStyle = 'rgba(235,240,255,.55)';
    for (const f of flakes) { f.y += f.s * devicePixelRatio; f.d += .01; f.x += Math.sin(f.d) * .3 * devicePixelRatio; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill(); }
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
