<style>
:root{--bg:#0b1020;--bg2:#121a33;--panel:rgba(20,28,54,.72);--fg:#e9ecf5;--muted:#9aa3bd;--line:rgba(196,205,230,.16);--gold:#d9c08a;--grid:rgba(196,205,230,.08);--axis:rgba(196,205,230,.28);--c0:#7aa7ff;--c1:#e98a6b;--c2:#5fd0a8;--c3:#f1d58f;--aoko:#3d6bff;--alice:#c2334a;--serif:"Cormorant Garamond","Shippori Mincho","Noto Serif SC","Songti SC","Yu Mincho",Georgia,serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei","Yu Gothic",sans-serif;line-height:1.6;
  background:radial-gradient(1200px 600px at 80% -10%,#24305e 0%,rgba(36,48,94,0) 60%),radial-gradient(900px 500px at 0% 0%,#1a2347 0%,rgba(26,35,71,0) 55%),linear-gradient(#0b1020,#0d1328 40%,#0b1020);min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px 56px;display:flex;flex-direction:column;gap:40px}
.hero{position:relative;margin:0 -20px;padding:40px 20px 0;overflow:hidden}
.hero-art{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.hero-art svg{position:absolute;right:0;bottom:0;width:100%;height:100%}
.moon{position:absolute;right:56px;top:96px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 62% 40%,#1a2450 0 47%,transparent 48%),radial-gradient(circle at 50% 50%,#fbf1d2 0 49%,transparent 50%);box-shadow:0 0 60px 18px rgba(241,213,143,.22)}
.top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--serif);letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--gold);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:0;line-height:1.25;letter-spacing:.04em;text-shadow:0 0 24px rgba(122,167,255,.25)}
h2{font-family:var(--serif);font-size:21px;font-weight:500;margin:0 0 6px;letter-spacing:.03em}

tr.live td{color:var(--gold);font-style:italic}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}.pager button{background:transparent;color:var(--gold);border:1px solid rgba(217,192,138,.45);border-radius:6px;padding:5px 14px;font:inherit;cursor:pointer}.pager button:disabled{opacity:.35;cursor:default}.pager button:not(:disabled):hover{background:rgba(217,192,138,.12)}.pager[hidden]{display:none}
.card.now{border-color:rgba(217,192,138,.55);box-shadow:0 0 0 1px rgba(217,192,138,.15) inset}
.card.now .v{color:var(--gold)}
h2::after{content:"";display:block;margin-top:8px;height:1px;width:120px;background:linear-gradient(90deg,var(--gold),rgba(217,192,138,0))}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;backdrop-filter:blur(6px);background:rgba(11,16,32,.4)}
.langs button{font:inherit;font-size:12px;letter-spacing:.06em;background:transparent;color:var(--muted);border:0;padding:6px 14px;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a1606}
.lead{position:relative;font-size:16px;margin:16px 0 0;max-width:720px}
.lead b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.upd{position:relative;font-size:12px;color:var(--muted);margin:8px 0 0;padding-bottom:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,176px),1fr));gap:14px;margin-top:-110px;position:relative}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;backdrop-filter:blur(8px)}
.card::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,rgba(217,192,138,0),rgba(217,192,138,.7),rgba(217,192,138,0))}
.k{font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.v{font-family:var(--serif);font-size:clamp(24px,2.6vw,30px);font-weight:600;margin:0;line-height:1.15;font-variant-numeric:lining-nums tabular-nums;color:#fff}
.u{font-size:14px;color:var(--muted);font-family:system-ui,sans-serif;font-weight:400;white-space:nowrap}
.s{font-size:12px;color:var(--muted);margin:6px 0 0}
section{position:relative}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 8px;font-size:13px;color:var(--muted)}
select{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=checkbox]{accent-color:var(--gold)}
.chart{position:relative;min-height:320px;width:100%;background:rgba(14,20,40,.55);border:1px solid var(--line);border-radius:12px;padding:8px 4px 0}
.chart svg text{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:rgba(16,22,44,.96);border:1px solid rgba(217,192,138,.45);box-shadow:0 8px 28px rgba(0,0,0,.45);border-radius:10px;padding:8px 12px;font-size:12px;white-space:nowrap;z-index:2;color:var(--fg)}
.tw{overflow-x:auto;background:rgba(14,20,40,.55);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}
th{color:var(--gold);font-weight:500;font-size:12px;letter-spacing:.04em}
details{background:rgba(14,20,40,.4);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details summary{cursor:pointer;font-family:var(--serif);font-size:17px}
details li{font-size:13px;color:var(--muted);margin:6px 0}
footer{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em}
.visits{margin-top:6px;color:var(--gold);opacity:.85}.visits b{font-weight:600}
footer::before{content:"✦";display:block;color:var(--gold);margin-bottom:8px;font-size:12px}
a{color:#9fc0ff}
.err{color:#ff8a8a;font-size:13px}
@media (max-width:900px){.moon,.hero-art .manor{display:none}}
@media (max-width:600px){h1{font-size:26px}.v{font-size:28px}.upd{padding-bottom:36px}.tiles{margin-top:0}}
</style>

const FILMS = [['HF1', '--c0'], ['HF2', '--c1'], ['HF3', '--c2'], ['MAHO', '--c3']];
const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (id) => document.getElementById(id);
const state = {crange: 0, range: 28, log: false, lang: 'zh'};
let L = I18N.zh;
function fmt(v, d = 0) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString(L.locale, {minimumFractionDigits: d, maximumFractionDigits: d}); }

// 优惠日的平均票价比平时低：张数多、单价低。只用于魔法使いの夜的票房分配（动员不受影响），HF 维持原样。
// 依据：TOHO 每周三「TOHOウェンズデイ」、每月 1 日「ファーストデイ」1,400 日元，12 月 1 日「映画の日」1,000 日元（一般 2,000～2,200 日元）；
// 其他院线的优惠日各不相同、学生和长者票本来就便宜，所以只按温和的比例折算。
const priceFactor = (iso) => {
  if (!iso) return 1;
  if (iso.slice(5) === '12-01') return 0.8;
  if (iso.slice(8) === '01') return 0.88;
  return new Date(iso + 'T00:00:00Z').getUTCDay() === 3 ? 0.9 : 1;
};

// 魔法使いの夜掉出全天榜前 25（或原帖缺）的日子：按最近两周的周环比往下推，再用当天第 25 名的张数封顶。
// 推算出的张数照常参与官方节点之间的分配，所以每次官方公布都会把它们一起校正。
function imputeMissing(rows) {
  const by = new Map(rows.map((r) => [r.day, r]));
  const real = rows.filter((r) => r.sales !== null);
  if (real.length < 14) return;
  const lastReal = real[real.length - 1].day;
  const wk = (d) => [0, 1, 2, 3, 4, 5, 6].map((j) => by.get(d - j)).every((x) => x && x.sales !== null && !x.imputed) ? [0, 1, 2, 3, 4, 5, 6].reduce((t, j) => t + by.get(d - j).sales, 0) : null;
  const a = wk(lastReal), b = wk(lastReal - 7);
  // 后期衰减会变慢：按 HF 三部回测，周环比取四次方根（衰减放缓）误差最小
  const ret = Math.pow(a && b ? Math.min(1, Math.max(0.3, a / b)) : 0.7, 0.25);
  for (const r of rows) {
    if (r.sales !== null || r.day <= lastReal) continue;
    const ago = by.get(r.day - 7), prev = by.get(r.day - 1);
    let v = ago && ago.sales !== null ? ago.sales * ret : prev && prev.sales !== null ? prev.sales * Math.pow(ret, 1 / 7) : null;
    const m = r.note.match(/第25名(\d+)张/);
    if (v !== null && m) v = Math.min(v, Number(m[1]));
    if (v !== null) { r.sales = Math.round(v); r.imputed = true; }
  }
}

function estimate(sample, milestones) {
  const out = [];
  for (const [f] of FILMS) {
    const rows = sample.filter((r) => r.film === f).map((r) => ({day: num(r.day), date: r.date, sales: num(r.sales), rank: num(r.rank), note: r.note || ''})).sort((a, b) => a.day - b.day);
    if (!rows.length) continue;
    if (f === 'MAHO') imputeMissing(rows);
    const maxDay = rows[rows.length - 1].day;
    const ms = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.day) !== null && num(m.day) <= maxDay);
    const alloc = (key) => {
      const pts = ms.filter((m) => num(m[key]) !== null).map((m) => [num(m.day), num(m[key])]).sort((a, b) => a[0] - b[0]);
      const w = (r) => r.sales * (key === 'gross' && f === 'MAHO' ? priceFactor(r.date) : 1);
      const est = new Map(); let prevDay = 0, prevVal = 0, ratio = null;
      for (const [d, v] of pts) {
        const seg = rows.filter((r) => r.day > prevDay && r.day <= d && r.sales !== null);
        const tot = seg.reduce((s, r) => s + w(r), 0);
        if (tot > 0) { ratio = (v - prevVal) / tot; seg.forEach((r) => est.set(r.day, w(r) * ratio)); }
        prevDay = d; prevVal = v;
      }
      rows.filter((r) => r.day > prevDay && r.sales !== null).forEach((r) => est.set(r.day, ratio === null ? null : w(r) * ratio));
      return est;
    };
    const ea = alloc('attendance'), eg = alloc('gross');
    let ca = 0, cg = 0;
    for (const r of rows) {
      const a = ea.has(r.day) ? ea.get(r.day) : null, g = eg.has(r.day) ? eg.get(r.day) : null;
      if (a !== null) ca += a; if (g !== null) cg += g;
      out.push({film: f, day: r.day, date: r.date, rank: r.rank, sales: r.sales, imputed: !!r.imputed, est_att: a, est_gross: g, cum_att: ca, cum_gross: cg});
    }
  }
  return out;
}

// 最终票房预测
// 基准：魔法使いの夜最新一天的估算累计（每天更新；每次官方公布都会把估算拉回官方数字）。
// 剩余部分：HF 从同一天到最终还涨了多少（剩余倍数），再按两部的近期走势校正：
//   走势校正 = [(近期售票占累计的比例之比) × (按周保留率推算的尾部长度之比)] 的 1/4 次方，第 8 天起生效，限制在 0.85～1.15 倍。
function forecast(est, milestones) {
  const ms = est.filter((r) => r.film === 'MAHO' && r.sales !== null && r.cum_att).sort((a, b) => a.day - b.day);
  if (!ms.length) return [];
  const mm = milestones.filter((m) => m.film === 'MAHO' && m.kind === 'point' && num(m.gross) !== null && num(m.attendance) !== null).sort((a, b) => num(b.day) - num(a.day));
  const sales = (f) => new Map(SAMPLE.filter((r) => r.film === f && num(r.sales) !== null).map((r) => [num(r.day), num(r.sales)]));
  const sm = sales('MAHO');
  const rows = [];
  FILMS.slice(0, 3).forEach(([f], i) => {
    const sh = sales(f);
    const maxDay = Math.max(0, ...sh.keys());
    const base = ms.filter((r) => r.day <= maxDay).pop();
    if (!base) return;
    const d = base.day;
    // 只用动员和票房都公布了的最终成绩；只有票房的（如 HF 第三章映连数字，含次年重映）不用，改用最后一个动员、票房都齐的官方节点（下限）
    const fin = milestones.find((m) => m.film === f && m.kind === 'final' && num(m.attendance) !== null && num(m.gross) !== null);
    const pts = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.gross) !== null && num(m.attendance) !== null).sort((a, b) => num(b.day) - num(a.day));
    const end = fin || pts[0];
    const e = est.find((r) => r.film === f && r.day === d);
    if (!end || !e || !e.cum_att || !e.cum_gross) return;
    const endA = num(end.attendance);
    const remH = Math.max(0, endA / e.cum_att - 1);
    // 走势校正（第 8 天起）：窗口最长两周；幅度只取四分之一、限制在 0.85～1.15 倍，避免假日、特别场次造成大起大落
    let adj = null;
    if (d >= 8 && !window.NO_ADJ) {
      const lag = d >= 28 ? 14 : 7, k = d >= 28 ? 14 : Math.min(7, d - 7);
      const recent = [...Array(k)].map((_, j) => d - j), prev = recent.map((x) => x - lag);
      const ok = (m, days) => days.every((x) => m.has(x));
      if (ok(sm, recent) && ok(sm, prev) && ok(sh, recent) && ok(sh, prev)) {
        const sum = (m, days) => days.reduce((t, x) => t + m.get(x), 0);
        const cumS = (m) => [...m].filter(([x]) => x <= d).reduce((t, [, v]) => t + v, 0);
        const weekly = (m) => Math.min(0.95, Math.max(0.05, Math.pow(sum(m, recent) / sum(m, prev), 7 / lag)));
        const rM = weekly(sm), rH = weekly(sh);
        const wM = sum(sm, recent) / cumS(sm), wH = sum(sh, recent) / cumS(sh);
        const tail = (r) => r / (1 - r);
        const raw = (wM / wH) * (tail(rM) / tail(rH));
        // 回测（拿 HF 三部互相当作「魔法使いの夜」）：全额校正误差变大，只取四分之一幅度、限制在 0.85～1.15 时误差最小
        adj = {f: Math.min(1.15, Math.max(0.85, Math.pow(raw, 0.25))), rM, rH};
      }
    }
    const remM = remH * (adj ? adj.f : 1);
    const mult = 1 + remM;
    const priceRatio = (num(end.gross) / endA) / (e.cum_gross / e.cum_att);
    let projAtt = base.cum_att * mult;
    let projGross = base.cum_att * remM * (base.cum_gross / base.cum_att) * priceRatio + base.cum_gross;
    let floored = false;
    const top = mm[0];
    if (top && (projGross < num(top.gross) || projAtt < num(top.attendance))) { projGross = Math.max(projGross, num(top.gross)); projAtt = Math.max(projAtt, num(top.attendance)); floored = true; }
    rows.push({idx: i, final: !!fin, floored, day: d, mult, adj, att: projAtt, gross: projGross});
  });
  return rows;
}

function lineChart(el, series, opts) {
  el.replaceChildren();
  const W = Math.max(280, el.clientWidth), H = 320, m = {t: 10, r: 34, b: 28, l: 60};
  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H).attr('role', 'img').attr('aria-label', opts.label);
  const x = d3.scaleLinear().domain([1, opts.maxX]).range([m.l, W - m.r]);
  const vals = series.flatMap((s) => s.pts.map((p) => p.y)).concat((opts.dots || []).map((p) => p.y)).filter((v) => v !== null && v > 0);
  const y = (opts.log ? d3.scaleLog().domain([Math.max(1, d3.min(vals)), d3.max(vals)]) : d3.scaleLinear().domain([0, d3.max(vals) || 1])).nice().range([H - m.b, m.t]);
  svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(x.ticks(Math.min(8, Math.floor(W / 70), opts.maxX - 1)).filter(Number.isInteger)).tickFormat((d) => L.day(d))).call((g) => g.selectAll('.domain,line').style('stroke', css('--axis')));
  svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(opts.yfmt)).call((g) => g.select('.domain').remove()).call((g) => g.selectAll('line').style('stroke', css('--grid')));
  const line = d3.line().defined((p) => p.y !== null && (!opts.log || p.y > 0)).x((p) => x(p.x)).y((p) => y(p.y));
  series.forEach((s) => svg.append('path').attr('d', line(s.pts)).attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', s.w).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round'));
  (opts.dots || []).forEach((p) => svg.append('circle').attr('cx', x(p.x)).attr('cy', y(p.y)).attr('r', 4).attr('fill', css('--bg')).attr('stroke', p.color).attr('stroke-width', 2));
  const tip = d3.select(el).append('div').attr('class', 'tip').style('display', 'none');
  const guide = svg.append('line').attr('y1', m.t).attr('y2', H - m.b).attr('stroke', css('--axis')).style('display', 'none');
  const hov = svg.append('g').style('pointer-events', 'none');
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
    .on('pointermove pointerdown', (ev) => {
      const [px] = d3.pointer(ev); const dx = Math.max(1, Math.min(opts.maxX, Math.round(x.invert(px))));
      guide.attr('x1', x(dx)).attr('x2', x(dx)).style('display', null);
      tip.selectAll('*').remove(); hov.selectAll('*').remove();
      tip.append('div').style('font-weight', '600').text(L.dayLong(dx));
      series.forEach((s) => {
        const p = s.pts.find((q) => q.x === dx);
        if (!p || p.y === null || (opts.log && p.y <= 0)) return;
        const row = tip.append('div').style('display', 'flex').style('align-items', 'center').style('gap', '6px');
        row.append('span').style('width', '10px').style('height', '10px').style('border-radius', '2px').style('background', s.color).style('flex', 'none');
        row.append('span').text(s.name + (L === I18N.en ? ': ' : '：') + opts.tipfmt(p.y));
        const note = opts.note ? opts.note(s.film, dx) : null;
        if (note) {
          tip.append('div').style('padding-left', '16px').style('white-space', 'pre').style('color', css('--muted')).text(note);
          if (note.dot) hov.append('circle').attr('cx', x(dx)).attr('cy', y(note.dot)).attr('r', 8).attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', 2);
        }
        hov.append('circle').attr('cx', x(dx)).attr('cy', y(p.y)).attr('r', 4).attr('fill', s.color).attr('stroke', css('--bg')).attr('stroke-width', 2);
      });
      const tw = tip.node().offsetWidth || 190;
      const left = x(dx) + 12 + tw > W ? x(dx) - 12 - tw : x(dx) + 12;
      tip.style('display', null).style('left', left + 'px').style('top', m.t + 'px');
    })
    .on('pointerleave', (ev) => { if (ev.pointerType === 'touch') return; tip.style('display', 'none'); guide.style('display', 'none'); hov.selectAll('*').remove(); });
}

let SAMPLE = null, MS = null, EST = [], FC = [], STATUS = null, INTERIM = [], RUN = null;
// 爬虫最后一次运行：读 GitHub 公开的运行记录（不需要登录；每个访客每小时最多 60 次，这里每 5 分钟一次）
const loadRun = () => fetch('https://api.github.com/repos/FinalST11/mahoyo-boxoffice/actions/workflows/update.yml/runs?per_page=1', {cache: 'no-store'}).then((r) => (r.ok ? r.json() : null)).then((j) => { RUN = j && j.workflow_runs && j.workflow_runs[0] ? j.workflow_runs[0] : null; if (SAMPLE) renderText(); }).catch(() => {});
// 把 ISO 时间显示成日本时间的「YYYY-MM-DD HH:MM」
const fmtJst = (iso) => { const t = new Date(iso); if (isNaN(t)) return ''; const j = new Date(t.getTime() + 9 * 3600e3); return j.toISOString().slice(0, 16).replace('T', ' '); };
const withUnit = (el, value, unit) => { el.replaceChildren(document.createTextNode(value)); if (unit) { const u = document.createElement('span'); u.className = 'u'; u.textContent = ' ' + unit; el.append(u); } };

// ── 当前估算（nowcast）────────────────────────────────
// 用这部电影自己的历史算出「14 时 / 19 时售出全天的比例」（平日、周末假日分开），
// 再按当前日本时间在 开场前→14 时→19 时→末场 之间线性插值，推算今天到现在为止的样本售票。
const REST_DAYS = new Set(['2026-11-23', '2026-12-29', '2026-12-30', '2026-12-31', '2027-01-01', '2027-01-02', '2027-01-03', '2027-01-11', '2027-02-11', '2027-02-23']);
const isRest = (iso) => { const w = new Date(iso + 'T00:00:00Z').getUTCDay(); return w === 0 || w === 6 || REST_DAYS.has(iso); };
// 四类：平日（第二天上班）、周五型（今天上班、明天休息）、周六型（今天、明天都休息）、周日型（今天休息、明天上班）
const dayType = (iso) => { const nx = isRest(addDays(iso, 1)); return isRest(iso) ? (nx ? 'sat' : 'sun') : (nx ? 'fri' : 'wk'); };
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const jstNow = () => { const j = new Date(Date.now() + 9 * 3600e3); return {date: j.toISOString().slice(0, 10), min: j.getUTCHours() * 60 + j.getUTCMinutes(), hhmm: j.toISOString().slice(11, 16)}; };
const median = (x) => { const v = x.slice().sort((a, b) => a - b); return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };

// 14 时 / 19 时集计占全天的比例，用本片已有的全部数据校准（每晚全天数字进来后自动更新）。
// 每类日子（平日 / 周五型 / 周六型 / 周日型）的比例 = 本类自己的中位数 和 所有日子的整体中位数 的加权平均：
//   比例 = (本类天数 × 本类中位数 + 2 × 整体中位数) ÷ (本类天数 + 2)
// 本类数据少时主要靠整体，多了就越来越看本类。首日有首映效应，不计入。
// 例外：平日 19 时从保守的 84% 起步（代替整体中位数），只用 11/25 起的实际平日数据逐步调整。
const OPENING = '2026-11-20';
function cutShares() {
  const full = new Map(SAMPLE.filter((r) => r.film === 'MAHO' && num(r.sales)).map((r) => [r.date, num(r.sales)]));
  const init = {14: 0.47, 19: 0.83};
  const sh = {wk: {}, fri: {}, sat: {}, sun: {}};
  for (const c of ['14', '19']) {
    const all = INTERIM.filter((r) => r.cut === c && num(r.sales) && full.has(r.date) && r.date !== OPENING).map((r) => ({t: dayType(r.date), d: r.date, v: num(r.sales) / full.get(r.date)}));
    const pooled = all.length ? median(all.map((x) => x.v)) : init[c];
    for (const t of Object.keys(sh)) {
      // 平日的 19 时比例偏保守：从 84% 起步（比例越高，推算的全天越少），只用 11/25 起的实际平日数据逐步调整
      const wk19 = t === 'wk' && c === '19';
      const own = all.filter((x) => x.t === t && (!wk19 || x.d >= '2026-11-25')).map((x) => x.v);
      const prior = wk19 ? 0.84 : pooled;
      sh[t][c] = own.length ? (own.length * median(own) + 2 * prior) / (own.length + 2) : prior;
    }
  }
  return sh;
}

function shareAt(type, min, sh) {
  const rest = type === 'sat' || type === 'sun', late = type === 'fri' || type === 'sat';
  const pts = [[rest ? 480 : 510, 0], [840, sh[type][14]], [1140, sh[type][19]], [late ? 1320 : 1290, 1]];
  if (min <= pts[0][0]) return 0;
  for (let i = 1; i < pts.length; i++) if (min <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (min - x0) / (x1 - x0); }
  return 1;
}

function nowcast() {
  const ms = EST.filter((r) => r.film === 'MAHO').sort((a, b) => a.day - b.day);
  const maho = ms[ms.length - 1];
  if (!maho || !maho.sales) return null;
  const rg0 = maho.est_gross / maho.sales / priceFactor(maho.date), ra = maho.est_att / maho.sales;
  if (!isFinite(rg0) || !isFinite(ra)) return null;
  const sh = cutShares(), now = jstNow();
  const byDate = new Map(SAMPLE.filter((r) => r.film === 'MAHO').map((r) => [r.date, num(r.sales)]));
  const days = [];
  let g = 0, a = 0;
  for (let d = addDays(maho.date, 1), k = 1; d <= now.date && k <= 3; d = addDays(d, 1), k++) {
    const type = dayType(d), day = maho.day + k;
    const im = INTERIM.filter((r) => r.date === d && num(r.sales)).sort((x, y) => Number(y.cut) - Number(x.cut))[0];
    let full, basis;
    if (im) { full = num(im.sales) / sh[type][im.cut]; basis = im.cut; }
    else {
      const wkAgo = byDate.get(addDays(d, -7)), lastAgo = byDate.get(addDays(maho.date, -7));
      if (wkAgo && lastAgo) { full = wkAgo * (maho.sales / lastAgo); basis = 'wk'; } else { full = maho.sales; basis = 'last'; }
    }
    const frac = d < now.date ? 1 : shareAt(type, now.min, sh);
    const sold = d < now.date ? full : Math.max(im && frac < sh[type][im.cut] ? num(im.sales) : 0, full * frac);
    const rg = rg0 * priceFactor(d);
    days.push({date: d, day, sold, est_gross: sold * rg, est_att: sold * ra, basis, partial: d === now.date});
    g += sold * rg; a += sold * ra;
  }
  if (!days.length) return null;
  return {hhmm: now.hhmm, base: maho, days, today: days[days.length - 1], cum_gross: maho.cum_gross + g, cum_att: maho.cum_att + a};
}

function renderText() {
  document.documentElement.lang = L.htmlLang; document.title = L.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = L[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  ['range', 'crange'].forEach((id) => [...$(id).options].forEach((o, i) => { o.textContent = i === 0 ? L.nowRange(mahoDay() || '—') : L.ranges[i - 1]; }));
  $('legend').replaceChildren(...L.legend.map((t, i) => { const s = document.createElement('span'); if (i < 4) { const sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = `var(${FILMS[i][1]})`; s.append(sw); } s.append(t); return s; }));
  $('method-list').innerHTML = L.methodList.map((h) => `<li>${h}</li>`).join('');
  const en = L === I18N.en;
  $('th-att').textContent = L.thAtt; $('th-gross').textContent = L.thGross; $('th-egross').textContent = L.thEGross; $('th-ecum').textContent = L.thECum;
  if (!SAMPLE) return;
  const maho = EST.filter((r) => r.film === 'MAHO').sort((a, b) => b.day - a.day)[0];
  const off = MS.filter((m) => m.film === 'MAHO' && m.kind === 'point').sort((a, b) => num(b.day) - num(a.day))[0];
  const g = FC.map((r) => r.gross / 1e8), a = FC.map((r) => r.att);
  const lo = Math.min(...g), hi = Math.max(...g), mid = g.reduce((s, v) => s + v, 0) / (g.length || 1);
  if (maho) {
    const loS = FC.length ? L.gross(lo, 1) : '—', hiS = FC.length ? L.gross(hi, 1) : '—';
    const nc = nowcast(), cur = nc ? {day: nc.today.day, cum_gross: nc.cum_gross} : maho;
    $('lead').innerHTML = loS === hiS ? L.lead(cur.day, L.gross(cur.cum_gross / 1e8, 2), loS, '').replace(/(<b>[^<]*<\/b>)[～–]<b><\/b>/, '$1') : L.lead(cur.day, L.gross(cur.cum_gross / 1e8, 2), loS, hiS);
    $('upd').textContent = L.upd(maho.date, maho.day, STATUS && STATUS.updated_at ? L.item(STATUS.last_item, fmtJst(STATUS.updated_at)) : '', RUN ? (RUN.status !== 'completed' ? L.chkRun : RUN.conclusion === 'success' ? L.chkOk(fmtJst(RUN.updated_at)) : L.chkFail(fmtJst(RUN.updated_at))) : '');
    $('k-est').textContent = maho.date === addDays(jstNow().date, -1) ? L.kEstY(maho.day) : L.kEst(maho.day);
    withUnit($('v-est'), L.gross(maho.cum_gross / 1e8, 2), L.grossUnit);
    $('s-est').textContent = L.sEst(L.att(maho.cum_att));
    if (nc) {
      $('k-now').textContent = L.kNow(nc.hhmm);
      withUnit($('v-now'), L.gross(nc.cum_gross / 1e8, 2), L.grossUnit);
      $('s-now').textContent = L.sNow(fmt(Math.round(nc.today.sold / 10) * 10), L.basis[nc.today.basis]);
    }
  }
  if (off) {
    $('k-off').textContent = L.kOff(off.day);
    withUnit($('v-off'), L.gross(num(off.gross) / 1e8, 2), L.grossUnit);
    $('s-off').textContent = L.sOff(L.att(num(off.attendance)));
  }
  if (FC.length) {
    withUnit($('v-fc'), L.gross(lo, 1) === L.gross(hi, 1) ? L.gross(lo, 1) : en ? L.gross(lo, 1) + '–' + L.gross(hi, 1).slice(1) : L.gross(lo, 1) + '～' + L.gross(hi, 1), L.grossUnit);
    $('s-fc').textContent = L.sFc(L.gross(mid, 1));
    withUnit($('v-fa'), L.att(Math.min(...a)) === L.att(Math.max(...a)) ? L.att(Math.min(...a)) : L.att(Math.min(...a)) + (en ? '–' : '～') + L.att(Math.max(...a)), L.attUnit);
  }
  $('ftable').replaceChildren(); FC.forEach((r) => { const tr = $('ftable').insertRow(); [L.films[r.idx], (r.final ? (r.grossOnly ? L.basisFinalGross : L.basisFinal) : L.basisLatest) + (r.floored ? L.floored : ''), L.dayLong(r.day), '×' + r.mult.toFixed(2), r.adj ? '×' + r.adj.f.toFixed(2) : '—', L.att(r.att), L.gross(r.gross / 1e8, 1)].forEach((v) => (tr.insertCell().textContent = v)); });
  // 每日明细：先把所有行（含当天推算行）按新到旧排好，再按每页 7 行分页
  const mrows = [];
  const ncT = nowcast();
  if (ncT) {
    let cg = ncT.base.cum_gross;
    ncT.days.map((x) => { cg += x.est_gross; return {...x, cum: cg}; }).reverse().forEach((x) => {
      mrows.push({live: true, cells: [x.date + ' · ' + (x.partial ? L.nowTag(ncT.hhmm) : L.fullTag), x.day, '—', '≈' + fmt(Math.round(x.sold / 10) * 10), fmt(Math.round(x.est_att)), L.estGrossCell(x.est_gross), L.cumCell(x.cum / 1e8)]});
    });
  }
  EST.filter((r) => r.film === 'MAHO').sort((x1, x2) => x2.day - x1.day).forEach((r) => {
    mrows.push({live: false, cells: [r.date, r.day, r.rank === null ? '—' : r.rank, r.imputed ? '≈' + fmt(r.sales) + L.imputedTag : fmt(r.sales), fmt(r.est_att), r.est_gross === null ? '—' : L.estGrossCell(r.est_gross), L.cumCell(r.cum_gross / 1e8)]});
  });
  const PER = 7, pages = Math.max(1, Math.ceil(mrows.length / PER));
  state.mpage = Math.min(Math.max(0, state.mpage || 0), pages - 1);
  $('mtable').replaceChildren();
  mrows.slice(state.mpage * PER, state.mpage * PER + PER).forEach((x) => {
    const tr = $('mtable').insertRow(); if (x.live) tr.className = 'live';
    x.cells.forEach((v) => (tr.insertCell().textContent = v));
  });
  $('mpager').hidden = pages <= 1;
  $('mpage-info').textContent = L.pageInfo(state.mpage + 1, pages);
  $('mprev').disabled = state.mpage === 0; $('mnext').disabled = state.mpage >= pages - 1;
  $('mprev').textContent = L.prevPage; $('mnext').textContent = L.nextPage;
}

const mahoDay = () => (SAMPLE ? Math.max(0, ...SAMPLE.filter((r) => r.film === 'MAHO').map((r) => num(r.day) || 0)) : 0);
const rangeOf = (v, maxDay) => (v === -1 ? Math.max(2, mahoDay()) : v || maxDay);

function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

// 校正记录：对每个官方节点，只用它之前的官方数字重新估算同一天的累计，和官方数字比较
function renderCalib() {
  if (!MS || !SAMPLE) return;
  const offs = MS.filter((m) => m.film === 'MAHO' && m.kind === 'point' && num(m.gross) !== null && num(m.attendance) !== null).sort((a, b) => num(a.day) - num(b.day));
  const tb = $('ctable'); tb.replaceChildren();
  if (offs.length < 2) { const td = tb.insertRow().insertCell(); td.colSpan = 5; td.textContent = L.calNone; return; }
  offs.slice(1).reverse().forEach((o) => {
    const d = num(o.day);
    const prior = MS.filter((m) => !(m.film === 'MAHO' && m.kind === 'point' && num(m.day) >= d));
    const row = estimate(SAMPLE.filter((r) => r.film !== 'MAHO' || num(r.day) <= d), prior).find((r) => r.film === 'MAHO' && r.day === d);
    const tr = tb.insertRow();
    const g = num(o.gross), e = row ? row.cum_gross : null;
    const err = e ? (e / g - 1) * 100 : null;
    [L.dayLong(d) + ' · ' + o.date + ((o.source_note || '').includes('待核对') ? L.calPending : ''), L.tipGross(g / 1e8), e ? L.tipGross(e / 1e8) : '—', err === null ? '—' : (err >= 0 ? '+' : '') + err.toFixed(1) + '%'].forEach((v) => (tr.insertCell().textContent = v));
    const c = tr.insertCell();
    if (o.source_url) { const a = document.createElement('a'); a.href = o.source_url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = hostOf(o.source_url); c.append(a); } else c.textContent = '—';
  });
}

function renderSources() {
  if (!MS) return;
  const box = $('sources'); box.replaceChildren();
  // 魔法使いの夜放最上面，后面依次是 HF 第一、二、三章
  [3, 0, 1, 2].map((i) => [...FILMS[i], i]).forEach(([film, color, i]) => {
    const rows = MS.filter((m) => m.film === film).sort((a, b) => (a.kind === 'final') - (b.kind === 'final') || num(a.day) - num(b.day));
    if (!rows.length) return;
    const h = document.createElement('h3'); h.className = 'srcfilm';
    const sw = document.createElement('i'); sw.style.background = `var(${color})`; h.append(sw, L.films[i]); box.append(h);
    const tw = document.createElement('div'); tw.className = 'tw';
    const t = document.createElement('table'); const hr = t.createTHead().insertRow();
    [L.thN, L.thDate, L.thOffAtt, L.thOffGross, L.thSrc].forEach((x) => { const th = document.createElement('th'); th.textContent = x; hr.append(th); });
    const tb = t.createTBody();
    rows.forEach((m) => {
      const tr = tb.insertRow(); const g = num(m.gross), a = num(m.attendance);
      [m.kind === 'final' ? L.finalRow : L.dayLong(num(m.day)), m.date || '—', a === null ? '—' : fmt(a), g === null ? '—' : L.tipGross(g / 1e8)].forEach((v) => (tr.insertCell().textContent = v));
      const c = tr.insertCell();
      if (m.source_url) { const el = document.createElement('a'); el.href = m.source_url; el.target = '_blank'; el.rel = 'noopener'; el.textContent = hostOf(m.source_url); c.append(el); } else c.textContent = '—';
    });
    tw.append(t); box.append(tw);
  });
}

function renderCharts() {
  if (!SAMPLE) return;
  const maxDay = Math.max(57, ...SAMPLE.map((r) => num(r.day) || 0));
  const series = (key) => FILMS.map(([f, c], i) => ({film: f, name: L.films[i], color: css(c), w: f === 'MAHO' ? 3 : 2, pts: key(f)}));
  const CR = rangeOf(state.crange, maxDay);
  lineChart($('cum'), series((f) => EST.filter((r) => r.film === f && r.day <= CR).map((r) => ({x: r.day, y: r.cum_gross ? r.cum_gross / 1e8 : null}))), {
    maxX: CR, label: L.labelCum, yfmt: L.axisGross, tipfmt: L.tipGross,
    note: (f, d) => {
      const m = MS.find((r) => r.film === f && r.kind === 'point' && num(r.day) === d);
      if (!m) return null;
      const t = new String(L.offNote(num(m.attendance), num(m.gross)) + (m.source_url ? '\n' + L.src(hostOf(m.source_url)) : ''));
      t.dot = num(m.gross) !== null ? num(m.gross) / 1e8 : null;
      return t;
    },
    dots: MS.filter((m) => m.kind === 'point' && num(m.gross) !== null && num(m.day) !== null && num(m.day) <= CR).map((m) => ({x: num(m.day), y: num(m.gross) / 1e8, color: css(FILMS.find((f) => f[0] === m.film)[1])}))});
  const R = rangeOf(state.range, maxDay);
  lineChart($('daily'), series((f) => SAMPLE.filter((r) => r.film === f && num(r.day) <= R).map((r) => ({x: num(r.day), y: num(r.sales)})).sort((a, b) => a.x - b.x)), {
    maxX: R, log: state.log, label: L.labelDaily, yfmt: L.axisSales, tipfmt: L.tipSales});
}

function setLang(lang) {
  state.lang = I18N[lang] ? lang : 'zh'; L = I18N[state.lang];
  try { localStorage.setItem('hf-lang', state.lang); } catch (e) {}

// 访问统计：abacus 免费计数器（无需注册）。同一浏览器只算一次访问人数，每次打开都算一次浏览。本地预览不计数。
const visits = {u: null, v: null};
function renderVisits() { const el = $('visits'); if (visits.u === null || visits.v === null) { el.hidden = true; return; } el.innerHTML = L.visits(fmt(visits.u), fmt(visits.v)); el.hidden = false; }
(async () => {
  if (!/github\.io$/.test(location.hostname)) return;
  const api = 'https://abacus.jasoncameron.dev', ns = 'finalst11-mahoyo-boxoffice';
  let seen = false; try { seen = localStorage.getItem('hf-visited') === '1'; } catch (e) {}
  const call = async (op, key) => { try { const r = await fetch(`${api}/${op}/${ns}/${key}`); if (!r.ok) return null; const j = await r.json(); return typeof j.value === 'number' ? j.value : null; } catch (e) { return null; } };

try { initial = localStorage.getItem('hf-lang') || ''; } catch (e) { initial = ''; }

const q = new URLSearchParams(location.search).get('lang'); if (I18N[q]) initial = q;

// 读取全部数据；页面开着时每 5 分钟重新读一次，爬虫推送的新数字（14/19 时集计、全天数字）会自动反映出来
const loadAll = () => Promise.all([d3.csv('data/sample.csv?v=' + Date.now()), d3.csv('data/milestones.csv?v=' + Date.now()), d3.json('data/status.json?v=' + Date.now()).catch(() => null), d3.csv('data/interim.csv?v=' + Date.now()).catch(() => [])]).then(([sample, ms, st, im]) => {

}).catch((e) => { document.querySelectorAll('.chart').forEach((el) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = L.loadErr; el.replaceChildren(p); }); console.error(e); });
loadAll();
loadRun();

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('crange').addEventListener('change', (e) => { state.crange = Number(e.target.value); renderCharts(); });
$('range').addEventListener('change', (e) => { state.range = Number(e.target.value); renderCharts(); });

$('mprev').addEventListener('click', () => { state.mpage--; renderText(); });
$('mnext').addEventListener('click', () => { state.mpage++; renderText(); });
setInterval(() => { if (SAMPLE) loadAll(); loadRun(); }, 5 * 60e3);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderCharts, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);

<script>
(() => {
  const c = document.getElementById('snow'); if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x = c.getContext('2d'); let W, H, flakes = [];
  const size = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; };
  size(); addEventListener('resize', size);
  const n = Math.min(70, Math.round(innerWidth / 18));
  for (let i = 0; i < n; i++) flakes.push({x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + .6) * devicePixelRatio, s: Math.random() * .5 + .25, d: Math.random() * Math.PI * 2});
  const tick = () => {
    x.clearRect(0, 0, W, H); x.fillStyle = 'rgba(235,240,255,.55)';
    for (const f of flakes) { f.y += f.s * devicePixelRatio; f.d += .01; f.x += Math.sin(f.d) * .3 * devicePixelRatio; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill(); }
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
