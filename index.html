.chart{position:relative;min-height:320px;width:100%}
.chart svg text{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap;z-index:2}

    axisGross: (v) => '¥' + (v / 10) + 'bn', tipGross: (oku) => '¥' + fmt(oku / 10, 3) + 'bn',
    axisSales: (v) => (v >= 1000 ? v / 1000 + 'k' : v), tipSales: (v) => fmt(v) + ' tickets',
    estGrossCell: (yen) => '¥' + fmt(yen / 1e6, 1) + 'M', cumCell: (oku) => '¥' + fmt(oku / 10, 3) + 'bn',
    labelCum: 'Estimated cumulative gross by day of release for the four films', labelDaily: 'Daily sampled ticket sales for the four films', loadErr: 'The data could not be loaded.'
  }
};

const FILMS = [['HF1', '--c0'], ['HF2', '--c1'], ['HF3', '--c2'], ['MAHO', '--c3']];
const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (id) => document.getElementById(id);
const state = {range: 30, log: false, lang: 'zh'};
let L = I18N.zh;
function fmt(v, d = 0) { return v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString(L.locale, {minimumFractionDigits: d, maximumFractionDigits: d}); }

function estimate(sample, milestones) {
  const out = [];
  for (const [f] of FILMS) {
    const rows = sample.filter((r) => r.film === f).map((r) => ({day: num(r.day), date: r.date, sales: num(r.sales), rank: num(r.rank)})).sort((a, b) => a.day - b.day);
    if (!rows.length) continue;
    const maxDay = rows[rows.length - 1].day;
    const ms = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.day) !== null && num(m.day) <= maxDay);
    const alloc = (key) => {
      const pts = ms.filter((m) => num(m[key]) !== null).map((m) => [num(m.day), num(m[key])]).sort((a, b) => a[0] - b[0]);
      const est = new Map(); let prevDay = 0, prevVal = 0, ratio = null;
      for (const [d, v] of pts) {
        const seg = rows.filter((r) => r.day > prevDay && r.day <= d && r.sales !== null);
        const tot = seg.reduce((s, r) => s + r.sales, 0);
        if (tot > 0) { ratio = (v - prevVal) / tot; seg.forEach((r) => est.set(r.day, r.sales * ratio)); }
        prevDay = d; prevVal = v;
      }
      rows.filter((r) => r.day > prevDay && r.sales !== null).forEach((r) => est.set(r.day, ratio === null ? null : r.sales * ratio));
      return est;
    };
    const ea = alloc('attendance'), eg = alloc('gross');
    let ca = 0, cg = 0;
    for (const r of rows) {
      const a = ea.has(r.day) ? ea.get(r.day) : null, g = eg.has(r.day) ? eg.get(r.day) : null;
      if (a !== null) ca += a; if (g !== null) cg += g;
      out.push({film: f, day: r.day, date: r.date, rank: r.rank, sales: r.sales, est_att: a, est_gross: g, cum_att: ca, cum_gross: cg});
    }
  }
  return out;
}

function forecast(est, milestones) {
  const mm = milestones.filter((m) => m.film === 'MAHO' && m.kind === 'point' && num(m.gross) !== null).sort((a, b) => num(b.day) - num(a.day));
  if (!mm.length) return [];
  const d = num(mm[0].day), A = num(mm[0].attendance), G = num(mm[0].gross);
  const rows = [];
  FILMS.slice(0, 3).forEach(([f], i) => {
    const fin = milestones.find((m) => m.film === f && m.kind === 'final');
    const pts = milestones.filter((m) => m.film === f && m.kind === 'point' && num(m.gross) !== null).sort((a, b) => num(b.day) - num(a.day));
    const end = fin || pts[0];
    const e = est.find((r) => r.film === f && r.day === d);
    if (!end || !e || !e.cum_att || !e.cum_gross) return;
    const mult = num(end.attendance) / e.cum_att;
    const priceRatio = (num(end.gross) / num(end.attendance)) / (e.cum_gross / e.cum_att);
    const projAtt = A * mult;
    rows.push({idx: i, final: !!fin, day: d, mult, att: projAtt, gross: projAtt * (G / A) * priceRatio});
  });
  return rows;
}

function lineChart(el, series, opts) {
  el.replaceChildren();
  const W = Math.max(280, el.clientWidth), H = 320, m = {t: 10, r: 34, b: 28, l: 60};
  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H).attr('role', 'img').attr('aria-label', opts.label);
  const x = d3.scaleLinear().domain([1, opts.maxX]).range([m.l, W - m.r]);
  const vals = series.flatMap((s) => s.pts.map((p) => p.y)).concat((opts.dots || []).map((p) => p.y)).filter((v) => v !== null && v > 0);
  const y = (opts.log ? d3.scaleLog().domain([Math.max(1, d3.min(vals)), d3.max(vals)]) : d3.scaleLinear().domain([0, d3.max(vals) || 1])).nice().range([H - m.b, m.t]);
  svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(Math.min(8, Math.floor(W / 70))).tickFormat((d) => L.day(d))).call((g) => g.selectAll('.domain,line').style('stroke', css('--axis')));
  svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(opts.yfmt)).call((g) => g.select('.domain').remove()).call((g) => g.selectAll('line').style('stroke', css('--grid')));
  const line = d3.line().defined((p) => p.y !== null && (!opts.log || p.y > 0)).x((p) => x(p.x)).y((p) => y(p.y));
  series.forEach((s) => svg.append('path').attr('d', line(s.pts)).attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', s.w).attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round'));
  (opts.dots || []).forEach((p) => svg.append('circle').attr('cx', x(p.x)).attr('cy', y(p.y)).attr('r', 4).attr('fill', css('--bg')).attr('stroke', p.color).attr('stroke-width', 2));
  const tip = d3.select(el).append('div').attr('class', 'tip').style('display', 'none');
  const guide = svg.append('line').attr('y1', m.t).attr('y2', H - m.b).attr('stroke', css('--axis')).style('display', 'none');
  const hov = svg.append('g').style('pointer-events', 'none');
  svg.append('rect').attr('x', m.l).attr('y', m.t).attr('width', W - m.l - m.r).attr('height', H - m.t - m.b).attr('fill', 'transparent')
    .on('pointermove pointerdown', (ev) => {
      const [px] = d3.pointer(ev); const dx = Math.max(1, Math.min(opts.maxX, Math.round(x.invert(px))));
      guide.attr('x1', x(dx)).attr('x2', x(dx)).style('display', null);
      tip.selectAll('*').remove(); hov.selectAll('*').remove();
      tip.append('div').style('font-weight', '600').text(L.dayLong(dx));
      series.forEach((s) => {
        const p = s.pts.find((q) => q.x === dx);
        if (!p || p.y === null || (opts.log && p.y <= 0)) return;
        const row = tip.append('div').style('display', 'flex').style('align-items', 'center').style('gap', '6px');
        row.append('span').style('width', '10px').style('height', '10px').style('border-radius', '2px').style('background', s.color).style('flex', 'none');
        row.append('span').text(s.name + (L === I18N.en ? ': ' : '：') + opts.tipfmt(p.y));
        hov.append('circle').attr('cx', x(dx)).attr('cy', y(p.y)).attr('r', 4).attr('fill', s.color).attr('stroke', css('--bg')).attr('stroke-width', 2);
      });
      const tw = tip.node().offsetWidth || 190;
      const left = x(dx) + 12 + tw > W ? x(dx) - 12 - tw : x(dx) + 12;
      tip.style('display', null).style('left', left + 'px').style('top', m.t + 'px');
    })
    .on('pointerleave', (ev) => { if (ev.pointerType === 'touch') return; tip.style('display', 'none'); guide.style('display', 'none'); hov.selectAll('*').remove(); });
}

let SAMPLE = null, MS = null, EST = [], FC = [];
const withUnit = (el, value, unit) => { el.replaceChildren(document.createTextNode(value)); if (unit) { const u = document.createElement('span'); u.className = 'u'; u.textContent = ' ' + unit; el.append(u); } };

function renderText() {
  document.documentElement.lang = L.htmlLang; document.title = L.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => { const v = L[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  [...$('range').options].forEach((o, i) => { o.textContent = L.ranges[i]; });
  $('legend').replaceChildren(...L.legend.map((t, i) => { const s = document.createElement('span'); if (i < 4) { const sw = document.createElement('i'); sw.className = 'sw'; sw.style.background = `var(${FILMS[i][1]})`; s.append(sw); } s.append(t); return s; }));
  $('method-list').innerHTML = L.methodList.map((h) => `<li>${h}</li>`).join('');
  const en = L === I18N.en;
  $('th-att').textContent = L.thAtt; $('th-gross').textContent = L.thGross; $('th-egross').textContent = L.thEGross; $('th-ecum').textContent = L.thECum;
  if (!SAMPLE) return;
  const maho = EST.filter((r) => r.film === 'MAHO' && r.sales !== null).sort((a, b) => b.day - a.day)[0];
  const off = MS.filter((m) => m.film === 'MAHO' && m.kind === 'point').sort((a, b) => num(b.day) - num(a.day))[0];
  const g = FC.map((r) => r.gross / 1e8), a = FC.map((r) => r.att);
  const lo = Math.min(...g), hi = Math.max(...g), mid = g.reduce((s, v) => s + v, 0) / (g.length || 1);
  if (maho) {
    $('lead').innerHTML = L.lead(maho.day, L.gross(maho.cum_gross / 1e8, 2), FC.length ? L.gross(lo, 1) : '—', FC.length ? L.gross(hi, 1) : '—');
    $('upd').textContent = L.upd(maho.date, maho.day);
    $('k-est').textContent = L.kEst(maho.day);
    withUnit($('v-est'), L.gross(maho.cum_gross / 1e8, 2), L.grossUnit);
    $('s-est').textContent = L.sEst(L.att(maho.cum_att));
  }
  if (off) {
    $('k-off').textContent = L.kOff(off.day);
    withUnit($('v-off'), L.gross(num(off.gross) / 1e8, 2), L.grossUnit);
    $('s-off').textContent = L.sOff(L.att(num(off.attendance)));
  }
  if (FC.length) {
    withUnit($('v-fc'), L.gross(lo, 1) + (en ? '–' : '～') + L.gross(hi, 1), L.grossUnit);
    $('s-fc').textContent = L.sFc(L.gross(mid, 1));
    withUnit($('v-fa'), L.att(Math.min(...a)) + (en ? '–' : '～') + L.att(Math.max(...a)), L.attUnit);
  }
  $('ftable').replaceChildren(); FC.forEach((r) => { const tr = $('ftable').insertRow(); [L.films[r.idx], r.final ? L.basisFinal : L.basisLatest, L.dayLong(r.day), '×' + r.mult.toFixed(2), L.att(r.att), L.gross(r.gross / 1e8, 1)].forEach((v) => (tr.insertCell().textContent = v)); });
  $('mtable').replaceChildren(); EST.filter((r) => r.film === 'MAHO').sort((x1, x2) => x2.day - x1.day).forEach((r) => {
    const tr = $('mtable').insertRow();
    [r.date, r.day, r.rank === null ? '—' : r.rank, fmt(r.sales), fmt(r.est_att), r.est_gross === null ? '—' : L.estGrossCell(r.est_gross), L.cumCell(r.cum_gross / 1e8)].forEach((v) => (tr.insertCell().textContent = v));
  });
}

function renderCharts() {
  if (!SAMPLE) return;
  const series = (key) => FILMS.map(([f, c], i) => ({name: L.films[i], color: css(c), w: f === 'MAHO' ? 3 : 2, pts: key(f)}));
  lineChart($('cum'), series((f) => EST.filter((r) => r.film === f).map((r) => ({x: r.day, y: r.cum_gross ? r.cum_gross / 1e8 : null}))), {
    maxX: 57, label: L.labelCum, yfmt: L.axisGross, tipfmt: L.tipGross,
    dots: MS.filter((m) => m.kind === 'point' && num(m.gross) !== null && num(m.day) !== null).map((m) => ({x: num(m.day), y: num(m.gross) / 1e8, color: css(FILMS.find((f) => f[0] === m.film)[1])}))});
  const R = state.range;
  lineChart($('daily'), series((f) => SAMPLE.filter((r) => r.film === f && num(r.day) <= R).map((r) => ({x: num(r.day), y: num(r.sales)})).sort((a, b) => a.x - b.x)), {
    maxX: R, log: state.log, label: L.labelDaily, yfmt: L.axisSales, tipfmt: L.tipSales});
}

function setLang(lang) {
  state.lang = I18N[lang] ? lang : 'zh'; L = I18N[state.lang];
  try { localStorage.setItem('hf-lang', state.lang); } catch (e) {}
  renderText(); renderCharts();
}

let initial = 'zh';
try { initial = localStorage.getItem('hf-lang') || ''; } catch (e) { initial = ''; }
if (!I18N[initial]) { const nav = (navigator.language || 'zh').toLowerCase(); initial = nav.startsWith('ja') ? 'ja' : nav.startsWith('zh') ? 'zh' : 'en'; }
const q = new URLSearchParams(location.search).get('lang'); if (I18N[q]) initial = q;
setLang(initial);

Promise.all([d3.csv('data/sample.csv?v=' + Date.now()), d3.csv('data/milestones.csv?v=' + Date.now())]).then(([sample, ms]) => {
  SAMPLE = sample; MS = ms; EST = estimate(sample, ms); FC = forecast(EST, ms);
  renderText(); renderCharts();
}).catch((e) => { document.querySelectorAll('.chart').forEach((el) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = L.loadErr; el.replaceChildren(p); }); console.error(e); });

document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('range').addEventListener('change', (e) => { state.range = Number(e.target.value); renderCharts(); });
$('log').addEventListener('change', (e) => { state.log = e.target.checked; renderCharts(); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderCharts, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCharts);
</script>
</body>
</html>
